name: CI

# The same gates as .forgejo/workflows/pr-checks.yml, for the pull requests that
# are opened here.
#
# Two jobs, deliberately, and the split is the lesson of the earlier single-job
# version: the anonymity gate needs a repository secret (.anonymize-list is
# gitignored by design, so it is absent from every checkout), and while it was
# the first step of the only job, a fork without that secret showed no checks at
# all beyond a red X. The gates that prove the package (version consistency,
# smoke, trivy) do not need the secret and must not be held hostage by it.
#
#   gates      version facts agree, the image runs, it carries no fixable HIGH or
#              CRITICAL vulnerability, and the SBOM is kept as an artefact.
#   anonymity  the image and the repo carry none of the estate's identity
#              strings. Fails closed when the secret is missing: a scan that
#              cannot make its strongest claim must say so rather than pass.
#
# What is NOT here, and why: nothing that needs a live Cloudron (backup-restore,
# upgrade, SSO topology). Those belong on a proving ground, not in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One tag for the whole job: every gate must inspect the same artefact, or
  # secret-scan proves something other than what smoke tested.
  IMAGE: ci-${{ github.run_id }}-${{ github.run_attempt }}
  IMAGE_REPO: ghcr.io/4glio/agentgateway-cloudron

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap, needs no build, and catches the half-release that no other gate
      # can see: a changelog entry for a version the manifest and the feed do
      # not name, or an image pinned to a namespace this repo does not publish.
      - name: version consistency
        run: |
          set -euo pipefail
          repo="$(python3 -c 'import json;print(json.load(open("CloudronManifest.json"))["dockerImage"].split("@")[0])')"
          if [ "$repo" = "ghcr.io/orcvole/agentgateway-cloudron" ]; then
            # TRANSITIONAL. Until the first Release run publishes this fork's own
            # image, the manifest and the feed still name the upstream packager's
            # image, which is public and correct for that version. From the first
            # release onwards the strict namespace check applies. Remove this
            # branch once CloudronManifest.json names $IMAGE_REPO.
            echo "::notice::manifest still pins $repo (inherited, pre-first-release); namespace check relaxed"
            python3 test/version_consistency.py
          else
            EXPECTED_IMAGE_REPO="$IMAGE_REPO" python3 test/version_consistency.py
          fi

      - name: build the image the gates inspect
        run: docker build -t "$IMAGE" .

      - name: smoke
        env:
          ENGINE: docker
        run: |
          if [ -x test/smoke.sh ]; then
            test/smoke.sh "$IMAGE"
          else
            echo "no test/smoke.sh in this package - skipping (this is expected for 4 of 18)"
          fi

      # Pinned, with a published checksum, and kept in step with
      # .forgejo/workflows/pr-checks.yml. An unpinned scanner's rule set moves
      # under you and turns a green history red with no change of ours; a
      # scanner that never installs turns it green for the wrong reason.
      - name: install the pinned trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.76.1
          TRIVY_SHA256=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: trivy
        env:
          # The bill of materials for exactly the image the gate just inspected,
          # published as an artefact: it is what an assessor asks for, and it is
          # unreconstructable later if the image is gone.
          SCAN_SBOM: sbom.cdx.json
        run: test/trivy-scan.sh "$IMAGE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: clean up
        if: always()
        run: docker rmi -f "$IMAGE" || true

  anonymity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build the image the scan inspects
        run: docker build -t "$IMAGE" .

      # secret-scan reads .anonymize-list for the box, identity and session
      # strings. That file is GITIGNORED on purpose, so it is absent from every
      # checkout: without it the scan still runs but proves far less while
      # reporting green. Ask the script whether it needs the file rather than
      # assuming, and refuse to continue without it.
      - name: restore the anonymity denylist
        env:
          ANONYMIZE_LIST: ${{ secrets.ANONYMIZE_LIST }}
        run: |
          set -euo pipefail
          if ! grep -q 'anonymize-list' test/secret-scan.sh; then
            echo "this package's scanner carries its patterns inline; no denylist needed"
            exit 0
          fi
          if [ -z "${ANONYMIZE_LIST:-}" ]; then
            echo "ANONYMIZE_LIST is not set for this repository, and this package's scanner reads it."
            echo "The scan would run without its box and identity patterns and report a green check"
            echo "that proves much less than it appears to. Set the secret (contents of"
            echo ".anonymize-list) in this repository's settings."
            exit 1
          fi
          printf '%s\n' "$ANONYMIZE_LIST" > .anonymize-list
          echo "denylist restored: $(grep -cvE '^\s*(#|$)' .anonymize-list) patterns"

      # First among the anonymity checks, because a leaked secret is the one
      # failure that cannot be undone after a push.
      - name: secret-scan
        env:
          ENGINE: docker
        run: test/secret-scan.sh "$IMAGE"

      - name: clean up
        if: always()
        run: |
          rm -f .anonymize-list || true
          docker rmi -f "$IMAGE" || true
